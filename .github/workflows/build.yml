name: Build FCOS bcachefs images

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild (ignore FCOS + bcachefs checks)"
        required: false
        default: "false"
      bcachefs_ref:
        description: "Build a specific bcachefs ref (tag or commit SHA) as an isolated git- tagged image. Leave empty for a normal build of the latest tag."
        required: false
        default: ""
      driver_ref:
        description: "bcachefs-storage-driver ref to build podman against. Leave empty for main."
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        fcos_stream:
          - stable
          - testing
          - next

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Ensure skopeo is available
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          fi

      - name: Resolve base image digest
        id: base
        run: |
          REF="quay.io/fedora/fedora-coreos:${{ matrix.fcos_stream }}"
          for i in 1 2 3 4 5; do
            DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${REF}") && break
            echo "skopeo inspect failed (attempt $i), retrying..."
            sleep $((i * 15))
          done
          test -n "$DIGEST"
          PINNED="quay.io/fedora/fedora-coreos@${DIGEST}"

          VERSION=$(skopeo inspect --format '{{index .Labels "org.opencontainers.image.version"}}' "docker://${PINNED}")
          if [ -z "$VERSION" ] || [ "$VERSION" = "<no value>" ]; then
            VERSION=$(curl -s "https://builds.coreos.fedoraproject.org/streams/${{ matrix.fcos_stream }}.json" \
              | jq -r '.architectures.x86_64.artifacts.metal.release')
          fi

          FREL="${VERSION%%.*}"
          case "$FREL" in
            ''|*[!0-9]*)
              echo "FATAL: could not parse a numeric Fedora major from version '${VERSION}'"
              exit 1
              ;;
          esac

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "pinned=${PINNED}" >> "$GITHUB_OUTPUT"
          echo "fcos_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "fcos_major=${FREL}" >> "$GITHUB_OUTPUT"
          echo "builder=quay.io/fedora/fedora:${FREL}" >> "$GITHUB_OUTPUT"

      - name: Resolve bcachefs ref
        id: bcachefs
        run: |
          if [ -n "${{ inputs.bcachefs_ref }}" ]; then
            REF="${{ inputs.bcachefs_ref }}"
            echo "Using provided ref: $REF"
          else
            REF=$(gh api 'repos/koverstreet/bcachefs-tools/tags?per_page=100' \
              --jq '[.[].name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))]
                    | sort_by(.[1:] | split(".") | map(tonumber)) | last')
            echo "Using latest tag: $REF"
          fi

          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "Could not resolve a bcachefs ref, aborting"
            exit 1
          fi

          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "short_ref=${REF:0:12}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve podman driver ref
        id: driver
        run: |
          REF="${{ inputs.driver_ref }}"
          : "${REF:=main}"
          SHA=$(git ls-remote https://github.com/ticpu/bcachefs-storage-driver.git "$REF" "$REF^{}" | tail -n1 | cut -f1)
          : "${SHA:=$REF}"
          echo "Driver ref $REF -> $SHA"
          echo "ref=$SHA" >> "$GITHUB_OUTPUT"
          echo "explicit=${{ inputs.driver_ref != '' }}" >> "$GITHUB_OUTPUT"

      - name: Resolve build mode
        id: mode
        run: |
          BRANCH="${{ github.ref_name }}"
          ISOLATED=false
          LABEL=""

          if [ -n "${{ inputs.bcachefs_ref }}" ]; then
            ISOLATED=true
            LABEL="${{ steps.bcachefs.outputs.short_ref }}"
            echo "isolated: explicit bcachefs_ref given"
          elif [ "$BRANCH" != "main" ]; then
            ISOLATED=true
            SAFE_BRANCH=$(printf '%s' "$BRANCH" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/^-*//; s/-*$//')
            LABEL="branch-${SAFE_BRANCH}"
            echo "isolated: running from non-main branch ($BRANCH)"
          else
            echo "normal build: main branch, no explicit refs"
          fi

          echo "isolated=$ISOLATED" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Check if rebuild is needed
        id: check
        run: |
          if [ "${{ steps.mode.outputs.isolated }}" = "true" ]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=""
          for i in 1 2 3; do
            CURRENT=$(skopeo inspect \
              --format '{{index .Labels "io.fcos-bcachefs.base-digest"}},{{index .Labels "io.fcos-bcachefs.bcachefs-ref"}}' \
              "docker://${IMAGE}:${{ matrix.fcos_stream }}" 2>&1) && break
            if echo "$CURRENT" | grep -q "manifest unknown"; then
              CURRENT="none"
              break
            fi
            echo "skopeo inspect failed (attempt $i), retrying..."
            CURRENT="none"
            sleep $((i * 15))
          done
          WANTED="${{ steps.base.outputs.digest }},${{ steps.bcachefs.outputs.ref }}"

          echo "current: ${CURRENT}"
          echo "wanted:  ${WANTED}"

          if [ "$CURRENT" != "$WANTED" ]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image tags
        id: tags
        if: ${{ steps.check.outputs.build_needed == 'true' }}
        run: |
          STREAM="${{ matrix.fcos_stream }}"
          REF="${{ steps.bcachefs.outputs.ref }}"
          FCOS="${{ steps.base.outputs.fcos_version }}"

          if [ "${{ steps.mode.outputs.isolated }}" = "true" ]; then
            TAGS="${IMAGE}:git-${{ steps.mode.outputs.label }}-${FCOS}-${STREAM}"
          else
            TAGS=$(printf '%s\n%s\n%s' \
              "${IMAGE}:${STREAM}" \
              "${IMAGE}:${REF}-${STREAM}" \
              "${IMAGE}:${REF}-${FCOS}-${STREAM}")
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute signing fingerprint
        id: signing
        run: |
          if [ -n "$MODULE_SIGNING_KEY" ] && [ -f certs/MOK.der ]; then
            echo "fingerprint=$(sha256sum certs/MOK.der | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "fingerprint=unsigned" >> "$GITHUB_OUTPUT"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        if: ${{ steps.check.outputs.build_needed == 'true' }}
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
        run: |
          SECRET_ARGS=()
          if [ -n "$MODULE_SIGNING_KEY" ]; then
            install -m 0600 /dev/null /tmp/module_signing_key
            printf '%s' "$MODULE_SIGNING_KEY" > /tmp/module_signing_key
            SECRET_ARGS=(--secret "id=module_signing_key,src=/tmp/module_signing_key")
          fi

          TAG_ARGS=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              TAG_ARGS+=("-t" "$tag")
            fi
          done <<< "${{ steps.tags.outputs.tags }}"

          podman build "${TAG_ARGS[@]}" \
            --build-arg BASE_IMAGE="${{ steps.base.outputs.pinned }}" \
            --build-arg BUILDER_IMAGE="${{ steps.base.outputs.builder }}" \
            --build-arg BCACHEFS_REF="${{ steps.bcachefs.outputs.ref }}" \
            --build-arg SIGNING_FINGERPRINT="${{ steps.signing.outputs.fingerprint }}" \
            --build-arg FCOS_MAJOR="${{ steps.base.outputs.fcos_major }}" \
            "${SECRET_ARGS[@]}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=Fedora CoreOS (${{ matrix.fcos_stream }}) with the bcachefs kernel module and bcachefs-tools" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.version=${{ steps.base.outputs.fcos_version }}" \
            --label "io.fcos-bcachefs.base-digest=${{ steps.base.outputs.digest }}" \
            --label "io.fcos-bcachefs.bcachefs-ref=${{ steps.bcachefs.outputs.ref }}" \
            --label "io.fcos-bcachefs.variant=stock" \
            .

      - name: Remove signing key from runner
        if: ${{ always() }}
        run: rm -f /tmp/module_signing_key

      - name: Smoke test image
        if: ${{ steps.check.outputs.build_needed == 'true' }}
        run: |
          TAG=$(echo "${{ steps.tags.outputs.tags }}" | head -n1 | xargs)
          podman run --rm --privileged \
            -e SIGNING_ENABLED="${{ steps.signing.outputs.enabled }}" \
            -e FCOS_MAJOR="${{ steps.base.outputs.fcos_major }}" \
            "$TAG" bash -c '
            set -eux

            KVER=$(rpm -q kernel-core --queryformat "%{VERSION}-%{RELEASE}.%{ARCH}")
            modinfo -k "$KVER" bcachefs
            VERMAGIC=$(modinfo -k "$KVER" -F vermagic bcachefs)
            case "$VERMAGIC" in "$KVER "*) ;; *) echo "vermagic mismatch: $VERMAGIC != $KVER"; exit 1;; esac

            rpm -q bcachefs-tools kmod-bcachefs podman
            bcachefs version
            test -f /usr/lib/modules-load.d/bcachefs.conf

            # Update mechanism differs by generation: rpm-ostree on <= 44,
            # bootc on newer. Assert the right one is actually configured
            # rather than skipping when absent.
            if [ "$FCOS_MAJOR" -le 44 ]; then
              grep -q "AutomaticUpdatePolicy=apply" /etc/rpm-ostreed.conf
              test -e /etc/systemd/system/timers.target.wants/rpm-ostreed-automatic.timer
              test -f /usr/lib/systemd/system/rpm-ostreed-automatic.timer.d/10-update-window.conf
            else
              test -e /etc/systemd/system/timers.target.wants/bootc-fetch-apply-updates.timer
              test -f /usr/lib/systemd/system/bootc-fetch-apply-updates.timer.d/10-update-window.conf
              test ! -e /usr/lib/systemd/system/rpm-ostreed-automatic.timer.d
            fi

            if [ "$SIGNING_ENABLED" = "true" ]; then
              SIGNER=$(modinfo -k "$KVER" -F signer bcachefs)
              echo "module signer: ${SIGNER}"
              test -n "$SIGNER"
              test -f /etc/pki/fcos-bcachefs/MOK.der
            fi

            # A registered driver reaches Init() and rejects the non-bcachefs
            # path; an unregistered one reports "driver not supported".
            OUT=$(podman --storage-driver bcachefs --root /tmp/pmtest info 2>&1 || true)
            echo "$OUT"
            if echo "$OUT" | grep -qi "not on a bcachefs filesystem"; then
              echo "stock image registers the bcachefs storage driver"; exit 1
            fi

            if [ -f /etc/containers/storage.conf ]; then
              if grep -q "^driver = \"bcachefs\"" /etc/containers/storage.conf; then
                echo "storage.conf defaults to bcachefs — must ship inert"; exit 1;
              fi
            fi
          '

      - name: Push image
        if: ${{ steps.check.outputs.build_needed == 'true' }}
        id: push
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              podman push --digestfile=/tmp/digest "$tag"
            fi
          done <<< "${{ steps.tags.outputs.tags }}"

          test -s /tmp/digest
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: ${{ steps.check.outputs.build_needed == 'true' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${{ steps.push.outputs.digest }}"
          fi
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      # The -driver image is the stock image with only podman replaced, built on
      # the exact digest published above so it can never drift from it.
      - name: Resolve stock image for the driver build
        id: stock
        run: |
          if [ "${{ steps.check.outputs.build_needed }}" = "true" ]; then
            DIGEST="${{ steps.push.outputs.digest }}"
          else
            DIGEST=""
            for i in 1 2 3; do
              DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:${{ matrix.fcos_stream }}") && break
              echo "skopeo inspect failed (attempt $i), retrying..."
              DIGEST=""
              sleep $((i * 15))
            done
          fi
          test -n "$DIGEST"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Resolve driver build mode
        id: dmode
        run: |
          ISOLATED="${{ steps.mode.outputs.isolated }}"
          LABEL="${{ steps.mode.outputs.label }}"
          if [ "$ISOLATED" != "true" ] && [ "${{ steps.driver.outputs.explicit }}" = "true" ]; then
            ISOLATED=true
            SAFE_DRIVER=$(printf '%s' "${{ inputs.driver_ref }}" | cut -c1-12 | tr -c 'a-zA-Z0-9._-' '-' | sed 's/^-*//; s/-*$//')
            LABEL="driver-${SAFE_DRIVER}"
            echo "isolated: explicit driver_ref given"
          fi
          echo "isolated=$ISOLATED" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Check if the driver image needs a rebuild
        id: dcheck
        run: |
          if [ "${{ steps.dmode.outputs.isolated }}" = "true" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=""
          for i in 1 2 3; do
            CURRENT=$(skopeo inspect \
              --format '{{index .Labels "io.fcos-bcachefs.stock-digest"}},{{index .Labels "io.fcos-bcachefs.driver-ref"}}' \
              "docker://${IMAGE}:${{ matrix.fcos_stream }}-driver" 2>&1) && break
            if echo "$CURRENT" | grep -q "manifest unknown"; then
              CURRENT="none"
              break
            fi
            echo "skopeo inspect failed (attempt $i), retrying..."
            CURRENT="none"
            sleep $((i * 15))
          done
          WANTED="${{ steps.stock.outputs.digest }},${{ steps.driver.outputs.ref }}"

          echo "current: ${CURRENT}"
          echo "wanted:  ${WANTED}"

          if [ "$CURRENT" != "$WANTED" ]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve driver image tags
        id: dtags
        if: ${{ steps.dcheck.outputs.build_needed == 'true' }}
        run: |
          STREAM="${{ matrix.fcos_stream }}"
          REF="${{ steps.bcachefs.outputs.ref }}"
          FCOS="${{ steps.base.outputs.fcos_version }}"

          if [ "${{ steps.dmode.outputs.isolated }}" = "true" ]; then
            TAGS="${IMAGE}:git-${{ steps.dmode.outputs.label }}-${FCOS}-${STREAM}-driver"
          else
            TAGS=$(printf '%s\n%s\n%s' \
              "${IMAGE}:${STREAM}-driver" \
              "${IMAGE}:${REF}-${STREAM}-driver" \
              "${IMAGE}:${REF}-${FCOS}-${STREAM}-driver")
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build driver image
        if: ${{ steps.dcheck.outputs.build_needed == 'true' }}
        run: |
          TAG_ARGS=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              TAG_ARGS+=("-t" "$tag")
            fi
          done <<< "${{ steps.dtags.outputs.tags }}"

          podman build "${TAG_ARGS[@]}" -f Dockerfile.driver \
            --build-arg STOCK_IMAGE="${IMAGE}@${{ steps.stock.outputs.digest }}" \
            --build-arg BUILDER_IMAGE="${{ steps.base.outputs.builder }}" \
            --build-arg BCACHEFS_DRIVER_REF="${{ steps.driver.outputs.ref }}" \
            --build-arg FCOS_MAJOR="${{ steps.base.outputs.fcos_major }}" \
            --label "org.opencontainers.image.description=Fedora CoreOS (${{ matrix.fcos_stream }}) with the bcachefs kernel module, bcachefs-tools and podman with the bcachefs storage driver" \
            --label "io.fcos-bcachefs.variant=driver" \
            --label "io.fcos-bcachefs.stock-digest=${{ steps.stock.outputs.digest }}" \
            --label "io.fcos-bcachefs.driver-ref=${{ steps.driver.outputs.ref }}" \
            .

      - name: Smoke test driver image
        if: ${{ steps.dcheck.outputs.build_needed == 'true' }}
        run: |
          TAG=$(echo "${{ steps.dtags.outputs.tags }}" | head -n1 | xargs)
          podman run --rm --privileged "$TAG" bash -c '
            set -eux

            rpm -q podman bcachefs-tools kmod-bcachefs

            # The stock image must not register the driver; this one must.
            OUT=$(podman --storage-driver bcachefs --root /tmp/pmtest info 2>&1 || true)
            echo "$OUT"
            echo "$OUT" | grep -qi "not on a bcachefs filesystem" || {
              echo "bcachefs storage driver not registered in podman"; exit 1;
            }

            if [ -f /etc/containers/storage.conf ]; then
              if grep -q "^driver = \"bcachefs\"" /etc/containers/storage.conf; then
                echo "storage.conf defaults to bcachefs — must ship inert"; exit 1;
              fi
            fi
          '

      - name: Push driver image
        if: ${{ steps.dcheck.outputs.build_needed == 'true' }}
        id: dpush
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              podman push --digestfile=/tmp/ddigest "$tag"
            fi
          done <<< "${{ steps.dtags.outputs.tags }}"

          test -s /tmp/ddigest
          echo "digest=$(cat /tmp/ddigest)" >> "$GITHUB_OUTPUT"

      - name: Sign driver image
        if: ${{ steps.dcheck.outputs.build_needed == 'true' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "${IMAGE}@${{ steps.dpush.outputs.digest }}"
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${{ steps.dpush.outputs.digest }}"
          fi
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
