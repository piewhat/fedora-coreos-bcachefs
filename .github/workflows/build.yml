name: Build FCOS bcachefs images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild (ignore FCOS + bcachefs checks)"
        required: false
        default: "false"
      bcachefs_ref:
        description: "Specific bcachefs ref to build, e.g. v1.9.0 or a commit SHA (leave empty for latest commit)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        fcos_stream:
          - stable
          - testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get latest FCOS build metadata
        id: fcos
        run: |
          STREAM=${{ matrix.fcos_stream }}
          ARCH=x86_64
          URL="https://builds.coreos.fedoraproject.org/streams/${STREAM}.json"
          LATEST=$(curl -s $URL | jq -r ".architectures.${ARCH}.artifacts.metal.formats.iso.disk.location")
          VERSION=$(curl -s "$URL" | jq -r ".architectures.${ARCH}.artifacts.metal.release")
          echo "fcos_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "fcos_build=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Resolve bcachefs ref
        id: bcachefs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.bcachefs_ref }}" ]; then
              REF="${{ inputs.bcachefs_ref }}"
              echo "Using provided ref: $REF"
            else
              REF=$(gh api repos/koverstreet/bcachefs-tools/commits/master \
                --jq '.sha')
              echo "Using latest commit: $REF"
            fi
          else
            REF=$(gh api repos/koverstreet/bcachefs-tools/tags \
              --jq '[.[].name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+"))] | first')
            echo "Using latest tag: $REF"
          fi

          if [ -z "$REF" ]; then
            echo "Could not resolve a bcachefs ref, aborting"
            exit 1
          fi

          SHORT_REF="${REF:0:12}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "short_ref=$SHORT_REF" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if rebuild is needed
        id: check
        run: |
          # Manual builds always run
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILE=".last_build_${{ matrix.fcos_stream }}"
          BUILD_NEEDED=false

          if [ ! -f "$FILE" ]; then
            BUILD_NEEDED=true
          else
            OLD_REF=$(cut -d',' -f1 "$FILE")
            OLD_FCOS=$(cut -d',' -f2 "$FILE")
            if [ "$OLD_REF" != "${{ steps.bcachefs.outputs.ref }}" ] || \
               [ "$OLD_FCOS" != "${{ steps.fcos.outputs.fcos_build }}" ]; then
              BUILD_NEEDED=true
            fi
          fi

          echo "build_needed=$BUILD_NEEDED" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: tags
        if: ${{ steps.check.outputs.build_needed == 'true' }}
        run: |
          BASE="ghcr.io/${{ github.repository }}"
          STREAM="${{ matrix.fcos_stream }}"
          REF="${{ steps.bcachefs.outputs.ref }}"
          SHORT_REF="${{ steps.bcachefs.outputs.short_ref }}"
          FCOS="${{ steps.fcos.outputs.fcos_version }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tags=${BASE}:git-${SHORT_REF}-${STREAM}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${BASE}:${STREAM} ${BASE}:${REF}-${STREAM} ${BASE}:${REF}-${FCOS}-${STREAM}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: ${{ steps.check.outputs.build_needed == 'true' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        if: ${{ steps.check.outputs.build_needed == 'true' }}
        run: |
          TAG_ARGS=$(echo "${{ steps.tags.outputs.tags }}" | xargs -n1 printf -- '-t %s ')
          docker build \
            --build-arg FCOS_STREAM=${{ matrix.fcos_stream }} \
            --build-arg BCACHEFS_REF=${{ steps.bcachefs.outputs.ref }} \
            $TAG_ARGS \
            .

      - name: Push Docker image
        if: ${{ steps.check.outputs.build_needed == 'true' }}
        run: |
          for TAG in ${{ steps.tags.outputs.tags }}; do
            docker push "$TAG"
          done

      - name: Save last build state
        if: ${{ steps.check.outputs.build_needed == 'true' && github.event_name != 'workflow_dispatch' }}
        run: |
          FILE=".last_build_${{ matrix.fcos_stream }}"
          echo "${{ steps.bcachefs.outputs.ref }},${{ steps.fcos.outputs.fcos_build }}" > "$FILE"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "$FILE"
          git commit -m "Update last build for ${{ matrix.fcos_stream }}" || echo "No changes to commit"
          git push origin main || echo "Push failed, probably no changes"
