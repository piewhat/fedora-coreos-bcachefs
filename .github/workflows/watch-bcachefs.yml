name: Watch for new bcachefs tags

on:
  schedule:
    - cron: "0 * * * *"   # runs hourly — only a single API call, very cheap
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve latest bcachefs tag
        id: bcachefs
        run: |
          TAG=$(gh api repos/koverstreet/bcachefs-tools/tags \
            --jq '[.[].name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+"))] | first')

          if [ -z "$TAG" ]; then
            echo "No matching bcachefs tag found, aborting"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if tag is new
        id: check
        run: |
          FILE=".last_bcachefs_tag"
          if [ ! -f "$FILE" ] || [ "$(cat $FILE)" != "${{ steps.bcachefs.outputs.tag }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger build for new tag
        if: steps.check.outputs.changed == 'true'
        run: |
          gh workflow run build.yml \
            --ref main \
            -f bcachefs_ref=${{ steps.bcachefs.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save last known bcachefs tag
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.bcachefs.outputs.tag }}" > .last_bcachefs_tag
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .last_bcachefs_tag
          git commit -m "Track bcachefs tag ${{ steps.bcachefs.outputs.tag }}"
          git push origin main
